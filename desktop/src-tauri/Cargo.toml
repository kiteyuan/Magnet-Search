[package]
name = "magnet"
version = "0.1.1"
description = "Magnet desktop web shell for https://magnet.kiteyuan.info"
authors = ["kiteyuan"]
edition = "2021"

[lib]
name = "magnet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
